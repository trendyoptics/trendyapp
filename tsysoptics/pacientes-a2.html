<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pacientes · TsysOptics A2</title><style>
:root{font:15px system-ui;color:#081226;background:#f2f2f2}*{box-sizing:border-box}body{margin:0}header{background:#081226;padding:17px;color:white;display:flex;justify-content:space-between;gap:12px;align-items:center}a{color:inherit}main{max-width:1050px;margin:auto;padding:20px}.card{background:white;border:1px solid #dce3ed;padding:18px;border-radius:12px;margin:14px 0}h1{margin:0}form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:grid;gap:5px;font-weight:650}input,select{font:inherit;padding:10px;border:1px solid #b9c5d4;border-radius:7px;min-width:0}button{background:#0b1c40;color:white;padding:10px 16px;border:0;border-radius:8px;cursor:pointer;font:inherit}.actions{display:flex;gap:10px;align-items:end}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;gap:12px;padding:12px;background:#f6f8fc;border-radius:9px;align-items:center}.muted{color:#53657b}[hidden]{display:none!important}@media(max-width:640px){form{grid-template-columns:1fr}main{padding:12px}}
</style></head><body><header><b>Pacientes · TsysOptics</b><a href="./panel-a2.html">Volver al panel</a></header><main><h1>Pacientes de mi óptica</h1><p id="status" role="status">Verificando acceso…</p><section id="content" hidden><div class="card"><h2 id="form-title">Registrar paciente</h2><form id="form"><label>Tipo de documento<select id="tipo"><option>CC</option><option>TI</option><option>CE</option><option>PA</option><option>RC</option><option>PEP</option><option>PPT</option></select></label><label>Número de documento<input id="documento" required minlength="3" maxlength="40"></label><label>Nombre completo<input id="nombre" required minlength="2" maxlength="180"></label><label>Fecha de nacimiento<input id="nacimiento" type="date"></label><label>Teléfono<input id="telefono" maxlength="40"></label><label>EPS<input id="eps" maxlength="120"></label><label>Dirección<input id="direccion" maxlength="200"></label><div class="actions"><button type="submit">Guardar paciente</button><button type="button" id="cancelar" hidden>Cancelar edición</button></div></form></div><div class="card"><h2>Buscar pacientes</h2><input id="buscar" placeholder="Nombre o documento" aria-label="Buscar pacientes"><p id="cantidad" class="muted"></p><div id="list" class="list"></div></div></section></main><script type="module" src="./pacientes-a2.js?v=1"></script></body></html>
