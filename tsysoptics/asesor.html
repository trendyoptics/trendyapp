<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Asesor TsysOptics</title><style>body{margin:0;background:#f2f2f2;color:#0b1c40;font:15px system-ui}header{background:#081226;color:#fff;padding:20px}main{max-width:900px;margin:auto;padding:24px}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:20px;margin:16px 0}label{display:block;margin:12px 0}input{display:block;padding:12px;width:90%}button{background:#0b1c40;color:white;border:0;border-radius:8px;padding:12px}p{color:#585f73}[hidden]{display:none}</style></head><body><header>TsysOptics · Asesor</header><main><section id="login" class="card"><h1>Acceso comercial</h1><form id="form"><label>Correo autorizado<input id="email" type="email" required></label><label>Contraseña<input id="pass" type="password" required></label><button>Entrar</button></form><p id="loginStatus">El rol asesor debe asignarse desde administración.</p></section><section id="panel" hidden><h1>Área comercial de demostración</h1><p>Ventas todavía sin conexión real. No se accede a historias clínicas completas.</p><button id="logout">Salir</button><article class="card"><h2>Indicaciones comerciales DEMO</h2><button id="refresh">Actualizar</button><p id="status"></p><div id="list"></div></article></section></main>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
import {SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY} from "./supabase-config.js";
const s=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),g=id=>document.getElementById(id);
async function check(){const {data,error}=await s.auth.getUser();if(error||!data.user)return false;const {data:p,error:e}=await s.from("usuarios_tsysoptics").select("rol,activo").eq("id",data.user.id).maybeSingle();if(e||p?.rol!=="asesor"||!p.activo)return false;g("login").hidden=true;g("panel").hidden=false;await load();return true}
async function load(){g("status").textContent="Consultando…";const {data,error}=await s.from("indicaciones_venta_demo_tsysoptics").select("codigo_demo,tipo_lente,tratamiento,instrucciones").limit(30);g("list").replaceChildren();if(error){g("status").textContent="No se pudieron cargar indicaciones.";return}g("status").textContent=data.length+" indicaciones ficticias";for(const p of data){const d=document.createElement("p");d.textContent=[p.codigo_demo,p.tipo_lente,p.tratamiento,p.instrucciones].join(" · ");g("list").append(d)}}
g("form").addEventListener("submit",async e=>{e.preventDefault();const {error}=await s.auth.signInWithPassword({email:g("email").value.trim(),password:g("pass").value});g("pass").value="";if(error||!await check())g("loginStatus").textContent="Credenciales incorrectas o rol sin autorización."});
g("refresh").addEventListener("click",load);g("logout").addEventListener("click",async()=>{await s.auth.signOut();location.reload()});await check();
</script></body></html>
