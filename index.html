<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TrendyOptics | Historia Clínica Optométrica y Cierre de Caja</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --navy-dark: #0B172A;
      --navy-med: #162544;
      --accent-blue: #0284C7;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F1F5F9;
      color: #0F172A;
      -webkit-tap-highlight-color: transparent;
    }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #F1F5F9; }
    ::-webkit-scrollbar-thumb { background: #94A3B8; border-radius: 3px; }

    .clinical-input {
      width: 100%;
      background-color: #FFFFFF;
      border: 1px solid #CBD5E1;
      border-radius: 0.5rem;
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      color: #0F172A;
      transition: all 0.15s ease-in-out;
      text-transform: uppercase;
    }
    .clinical-input::placeholder { text-transform: uppercase; }
    .clinical-input:focus {
      outline: none;
      border-color: #0284C7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    .clinical-label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #334155;
      margin-bottom: 0.25rem;
    }

    input[type="text"], input[type="search"], input[type="tel"], textarea, select {
      text-transform: uppercase;
    }

    /* CONFIGURACIÓN IMPRESIÓN MEDIA CARTA */
    @media print {
      @page {
        size: letter portrait;
        margin: 0.4cm 0.6cm;
      }
      body {
        background: #FFFFFF !important;
        color: #000000 !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      #print-area {
        display: block !important;
        width: 100% !important;
        max-height: 13.4cm !important;
        box-sizing: border-box;
        font-size: 9pt;
        line-height: 1.22;
        border-bottom: 1px dashed #64748B;
        padding-bottom: 0.25cm;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-28 lg:pb-12">

  <!-- ENCABEZADO SUPERIOR -->
  <header class="no-print bg-[#0B172A] text-white shadow-lg sticky top-0 z-40 border-b border-slate-800">
    <div class="max-w-[1600px] mx-auto px-3 sm:px-6 py-2.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="relative group cursor-pointer" onclick="document.getElementById('logoUploader').click()" title="Haz clic si deseas subir el archivo de imagen de tu logo">
          <input type="file" id="logoUploader" accept="image/*" class="hidden" onchange="handleCustomLogo(event)">
          <div id="logoContainer" class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-white p-0.5 shadow-md flex items-center justify-center overflow-hidden">
            <svg id="defaultLogoSvg" viewBox="0 0 240 240" class="w-full h-full">
              <circle cx="120" cy="120" r="116" fill="#0B1F3F" stroke="#08152C" stroke-width="3"/>
              <circle cx="120" cy="120" r="108" fill="none" stroke="#CBD5E1" stroke-width="2"/>
              <circle cx="120" cy="120" r="78" fill="#D1D5DB" stroke="#060D1A" stroke-width="3"/>
              <path d="M 75,38 Q 120,24 165,38 L 160,56 Q 120,44 80,56 Z" fill="#CBD5E1"/>
              <path id="topArc" d="M 75,49 Q 120,35 165,49" fill="none"/>
              <text font-family="'Courier Prime', monospace" font-size="19" font-weight="bold" fill="#0B1F3F" letter-spacing="2">
                <textPath href="#topArc" startOffset="50%" text-anchor="middle">ÓPTICA</textPath>
              </text>
              <polygon points="8,108 62,108 55,120 62,132 8,132" fill="#CBD5E1" stroke="#FFFFFF" stroke-width="1.5"/>
              <text x="33" y="124" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0B1F3F" text-anchor="middle">Clear</text>
              <polygon points="232,108 178,108 185,120 178,132 232,132" fill="#CBD5E1" stroke="#FFFFFF" stroke-width="1.5"/>
              <text x="207" y="124" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0B1F3F" text-anchor="middle">Vision</text>
              <text x="120" y="88" font-family="'Playfair Display', serif" font-style="italic" font-size="25" font-weight="600" fill="#000000" text-anchor="middle">Trendy</text>
              <text x="120" y="116" font-family="'Playfair Display', serif" font-style="italic" font-size="33" font-weight="600" fill="#000000" text-anchor="middle">Optics</text>
              <circle cx="88" cy="148" r="24" fill="none" stroke="#000000" stroke-width="4.5"/>
              <circle cx="152" cy="148" r="24" fill="none" stroke="#000000" stroke-width="4.5"/>
              <path d="M 112,146 Q 120,135 128,146" fill="none" stroke="#000000" stroke-width="4.5" stroke-linecap="round"/>
              <path d="M 34,158 A 94,94 0 0,0 206,158 L 190,180 A 112,112 0 0,1 50,180 Z" fill="#CBD5E1" opacity="0.95"/>
              <path id="bottomArc" d="M 38,162 A 88,88 0 0,0 202,162" fill="none"/>
              <text font-family="'Courier Prime', monospace" font-size="13.5" font-weight="bold" fill="#0B1F3F" letter-spacing="1.5">
                <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">LENTES EN TENDENCIA</textPath>
              </text>
            </svg>
            <img id="customLogoImg" src="" alt="Logo" class="hidden w-full h-full object-contain rounded-full" />
          </div>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-lg sm:text-xl font-extrabold tracking-tight text-white">TrendyOptics</h1>
            <span class="text-[10px] font-bold uppercase bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 px-2 py-0.5 rounded-full">Drive Activo</span>
          </div>
          <p class="text-[11px] text-slate-300 leading-tight">Calle 39a Sur N 87d - 58 | Patio Bonito, Bogotá &bull; NIT: 1073263942-5 &bull; Cel: +57 3003391055</p>
        </div>
      </div>

      <div class="flex items-center gap-2 ml-auto">
        <button type="button" onclick="openHistoryModal()" class="flex items-center gap-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-lg border border-slate-700">
          <i data-lucide="folder-search" class="w-4 h-4 text-sky-400"></i>
          <span>Pacientes (<span id="savedCountBadge">0</span>)</span>
        </button>
        <a href="https://docs.google.com/spreadsheets/d/19hbfmMq5Vdq4OsQDuG3kq-mD_lLoC2EuxFXXLNeU8Kw/edit?gid=0#gid=0" target="_blank" class="flex items-center gap-1.5 text-xs font-semibold bg-emerald-900/50 hover:bg-emerald-800/70 text-emerald-200 px-3 py-2 rounded-lg border border-emerald-700/60">
          <i data-lucide="table" class="w-4 h-4 text-emerald-400"></i>
          <span class="hidden md:inline">Abrir Excel Drive</span>
        </a>
        <button type="button" onclick="openDriveModal()" class="flex items-center gap-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-lg border border-slate-700">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
          <i data-lucide="cloud" class="w-4 h-4 text-emerald-400"></i>
          <span class="hidden sm:inline">Drive</span>
        </button>
        <button type="button" onclick="limpiarFormulario()" class="flex items-center gap-1 text-xs font-semibold bg-rose-950/60 hover:bg-rose-900/80 text-rose-200 px-2.5 py-2 rounded-lg border border-rose-800/50">
          <i data-lucide="file-plus-2" class="w-4 h-4 text-rose-400"></i>
          <span class="hidden md:inline">Nueva</span>
        </button>
      </div>
    </div>
  </header>

  <!-- FORMULARIO PRINCIPAL (3 COLUMNAS) -->
  <main class="no-print max-w-[1600px] w-full mx-auto px-3 sm:px-6 py-4 flex-1">
    <form id="hcForm" onsubmit="event.preventDefault();" class="grid grid-cols-1 lg:grid-cols-3 gap-4 items-start">

      <!-- COLUMNA 1: IDENTIFICACIÓN Y ADMISIÓN -->
      <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-5 space-y-4">
        <div class="flex items-center justify-between border-b border-slate
